[package]
name = "ganymede-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Jupyter desktop client for macOS"
publish = false

[features]
# Opt into unfinished UI in optimized development builds.
unfinished = []

[dependencies]
semver = "1"
anyhow = "1"
libc = "0.2"
unicode-segmentation = "1"
rust-embed = { version = "8.12", features = ["debug-embed", "include-exclude"] }
ganymede-core.workspace = true
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", rev = "4c7244790a075e862eeb4e5ccc12d6c8f5da6f7e" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "4c7244790a075e862eeb4e5ccc12d6c8f5da6f7e", features = ["font-kit", "wayland", "x11"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
base64 = "0.22"
pulldown-cmark = "0.13"
scraper = "0.24"
latex-rust = { version = "3", default-features = false }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tree-sitter-highlight = "0.25"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5.4"
tree-sitter-yaml = "0.7.2"
tree-sitter-sequel = "0.3.12"
regex = "1.13.1"
reqwest = "0.13.5"
percent-encoding = "2"

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", rev = "4c7244790a075e862eeb4e5ccc12d6c8f5da6f7e", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26.1"
