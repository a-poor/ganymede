[workspace]
members = ["ganymede-gui", "ganymede-core"]
default-members = ["ganymede-gui"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a-poor/ganymede"

[workspace.dependencies]
ganymede-core = { path = "ganymede-core" }
