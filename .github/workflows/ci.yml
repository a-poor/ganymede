name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full macOS checks and release build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  quick:
    name: Linux core checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: cargo fmt --all -- --check
      - name: Test release automation
        run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo clippy --locked -p ganymede-core --all-targets -- -D warnings
      - run: cargo test --locked -p ganymede-core

  checks:
    name: Full macOS checks
    needs: quick
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-checks-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-checks-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Fetch bundled fonts and icons
        run: bash scripts/fetch-assets.sh
      - name: Prepare Metal compiler
        run: |
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Test release automation
        run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Check unfinished feature
        run: cargo check --locked -p ganymede-gui --features unfinished

  release:
    name: macOS release build
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Fetch bundled fonts and icons
        run: bash scripts/fetch-assets.sh
      - name: Prepare Metal compiler
        run: |
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      # Never use --all-features here: it opts into unfinished UI.
      - name: Build and bundle release
        run: bash scripts/package-macos.sh
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Ganymede-macOS-${{ runner.arch }}-unsigned
          path: |
            target/dist/Ganymede-macOS.zip
            target/dist/Ganymede-macOS.dmg
          if-no-files-found: error
          retention-days: 14
